<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets theme.ts pad screens by the notch and home indicator -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <title>Potato Patata</title>
  <meta itemprop="name" content="Potato Patata">
  <meta name="twitter:title" content="Potato Patata">
  <meta property="og:title" content="Potato Patata">
  <meta property="og:site_name" content="Potato Patata">
  <meta name="description" content="Place a potato on the ground, record ten seconds of its visit and send it back.">
  <meta itemprop="description" content="Place a potato on the ground, record ten seconds of its visit and send it back.">
  <meta property="og:description" content="Place a potato on the ground, record ten seconds of its visit and send it back.">
  <meta name="twitter:description" content="Place a potato on the ground, record ten seconds of its visit and send it back.">
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <meta property="og:image" content="https://potato-patata.online/assets/potato-home.jpg">
</head>

<body>
<!-- Build hash in the URL so phones fetch the new bundle after each deploy instead of a cached one -->
<script src="bundle.js?v=<%= compilation.hash %>"></script>

</body>

</html>
